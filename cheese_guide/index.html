<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cheese Guide</title>
    <link rel="stylesheet" href="vars.css" />
    <link rel="stylesheet" href="global.css" />
    <!--
    GRID HOLY GRAIL
    The full holy grail in ONE grid container — no wrappers, no nesting.
    grid-template-areas draws the layout as ASCII art: header and footer
    span all three columns, nav | main | aside share the middle row.
    Because every region is placed by name, the single media query below
    re-draws the whole page as one column just by rewriting the map.
  -->
    <style>
      body {
        --nav-width: 10rem;
        --aside-width: 12rem;

        display: grid;
        grid-template-areas:
          "header header header"
          "nav    main   aside"
          "footer footer footer";
        grid-template-columns: var(--nav-width) 1fr var(--aside-width);
        grid-template-rows: auto 1fr auto;
        min-height: 100svh;

        > header {
          grid-area: header;
          padding: var(--space-2) var(--space-3);
          border-block-end: var(--border);
          background: var(--panel);
        }

        > nav {
          grid-area: nav;
          padding: var(--space-2);
          border-inline-end: var(--border);
          background: var(--panel);

          ul {
            margin: 0;
            padding: 0;
            list-style: none;
          }
        }

        > main {
          grid-area: main;
          padding: var(--space-3);
        }

        > aside {
          grid-area: aside;
          padding: var(--space-2);
          border-inline-start: var(--border);
          background: var(--panel);
        }

        > footer {
          grid-area: footer;
          padding: var(--space-2) var(--space-3);
          border-block-start: var(--border);
          background: var(--panel);
        }

        @media (max-width: 40rem) {
          grid-template-areas:
            "header"
            "nav"
            "main"
            "aside"
            "footer";
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr auto auto;

          > nav,
          > aside {
            border-inline: none;
            border-block-end: var(--border);
          }
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The Cheese Society</h1>
      <img
        src="images/logo.svg"
        alt="Cheese Society logo"
        width="40"
        height="40"
      />
    </header>

    <nav>
      <p>Nav — <code>grid-area: nav</code>.</p>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="/cheese_guide/about.html">About Us</a></li>
        <li><a href="/cheese_guide/join.html">Join Us</a></li>
      </ul>
    </nav>

    <main></main>

    <aside>
      <h2>Cheese of the Month</h2>
    </aside>

    <footer>
      <p>
        Footer — spans all three columns via
        <code>"footer footer footer"</code>.
      </p>
    </footer>
  </body>
</html>
